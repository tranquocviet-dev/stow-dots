#################################
#           Backend             #
#################################

backend = "glx";
vsync = true;
use-damage = true;

#################################
#       General Settings        #
#################################

frame-opacity = 0.0;
corner-radius = 0;
transparent-clipping = true;

blur: {
  method = "none";
  background = false;
};

shadow = false;

#################################
#         Unified Rules         #
#################################

rules = (
  # Active & Inactive window opacity defaults (replaces active-opacity & inactive-opacity)
  {
    match = "focused";
    opacity = 0.8;
  },
  {
    match = "!focused";
    opacity = 0.6;
  },

  # Force 100% opacity for fullscreen windows, i3 frames, and polybar
  {
    match = "fullscreen || class_g = 'i3-frame' || class_g = 'polybar' || class_g = 'Rofi'";
    opacity = 1.0;
  },

  # Replaces the legacy wintypes section for dock (shadow = false, opacity = 0.95)
  {
    match = "window_type = 'dock'";
    shadow = false;
    opacity = 0.95;
  },

  # Disable shadows for desktops, conky, and utility panels
  {
    match = "window_type = 'desktop' || class_g = 'Conky' || class_g = 'IceWM' || class_g = 'TaskBar'";
    shadow = false;
  },

  # Exclude slop (selection tools) from transparent clipping
  {
    match = "class_g = 'slop' || class_i = 'slop' || _NET_WM_NAME@:s = 'slop'";
    transparent-clipping = false;
  }
);